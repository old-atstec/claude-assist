- id: alisa_claude_request
  alias: "Алиса → Claude → колонка"
  description: >-
    Фраза из навыка Яндекс.Диалогов отправляется агенту Claude,
    ответ озвучивается на колонке, с которой спросили.
  mode: queued
  max: 5
  triggers:
    - trigger: event
      event_type: alisa_claude_request
  variables:
    # Имя в input_select → conversation-агент
    agents:
      "Claude Sonnet 5": conversation.claude_conversation_2
      "Claude Haiku 4.5": conversation.claude_conversation
    agent_id: >-
      {{ agents.get(states('input_select.alisa_claude_agent'), 'conversation.claude_conversation_2') }}
    # application_id навыка → колонка. application_id меняется при пересоздании
    # навыка (уникален для пары устройство+навык), поэтому ниже есть ещё привязка
    # по модели устройства из client_id. Оба id видны в логе HA («alisa: …»).
    speakers:
      # Станция Макс (client_id "… (Yandex Station_2; android 9)")
      "94423906A3A2342610B7CBB2C963383354439DD3659D38050172DD912B8FAB96": media_player.yandex_station_xw0000000000000011600002d22c5a80
      # Станция Мини
      "7FDC05BAA53695EF4C984EB9DB5775CDA5E7DBFA066B3F2E037A5D8A279540C5": media_player.yandex_station_ff98f029c1fe1ab9856023b1
    # Подстрока платформы из client_id (в нижнем регистре) → колонка.
    # station_2 = Станция Макс, mini = Станция Мини. Работает, пока модели не повторяются.
    speakers_by_model:
      "station_2": media_player.yandex_station_xw0000000000000011600002d22c5a80
      "mini": media_player.yandex_station_ff98f029c1fe1ab9856023b1
    default_speaker: media_player.yandex_station_xw0000000000000011600002d22c5a80
    client_id: "{{ (trigger.event.data.client_id or '') | lower }}"
    by_model: >-
      {% set ns = namespace(v='') %}
      {% for key, ent in speakers_by_model.items() if key in client_id %}{% set ns.v = ent %}{% endfor %}
      {{ ns.v }}
    # Запасной вариант: в момент запроса спрашивающая колонка в BUSY/LISTENING,
    # а та, что договаривает прошлый ответ, — в SPEAKING, поэтому её берём последней.
    active_speaker: >-
      {% set ns = namespace(v='') %}
      {% for st in ['BUSY', 'LISTENING', 'SPEAKING'] if not ns.v %}
        {% set ns.v = states.media_player
           | selectattr('attributes.alice_state', 'eq', st)
           | map(attribute='entity_id') | list | first | default('') %}
      {% endfor %}
      {{ ns.v }}
    speaker: >-
      {{ speakers.get(trigger.event.data.application_id) or by_model or active_speaker or default_speaker }}
    # Подсказка агенту: ответ пойдёт в голос, markdown и простыни не нужны
    prompt_prefix: >-
      Ответ будет озвучен голосовым ассистентом: отвечай кратко, обычным текстом без markdown.
  actions:
    - action: system_log.write
      data:
        level: info
        logger: alisa_claude
        message: >-
          alisa: application_id={{ trigger.event.data.application_id }}
          client_id={{ client_id }} speaker={{ speaker }} agent={{ agent_id }} text={{ trigger.event.data.text }}
    - action: conversation.process
      continue_on_error: true
      data:
        agent_id: "{{ agent_id }}"
        conversation_id: "alisa-{{ trigger.event.data.application_id or 'default' }}"
        text: "{{ prompt_prefix }} {{ trigger.event.data.text }}"
      response_variable: result
    - variables:
        answer: >-
          {% set speech = (result.response.speech.plain.speech
                           if result is defined and result.response is defined else '') %}
          {% if speech %}
            {{ speech | regex_replace('[*_`#]', '') | truncate(900, true, '…') }}
          {% else %}
            Не получилось получить ответ от Клода
          {% endif %}
    - action: system_log.write
      data:
        level: info
        logger: alisa_claude
        message: "alisa: speaker={{ speaker }} answer={{ answer }}"
    - action: media_player.play_media
      target:
        entity_id: "{{ speaker }}"
      data:
        media_content_type: text
        media_content_id: >-
          {% set voice = states('input_text.alisa_claude_voice') | trim %}
          {% if voice and voice not in ('unknown', 'unavailable') %}<speaker voice="{{ voice }}">{% endif %}{{ answer }}
